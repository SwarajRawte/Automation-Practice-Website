name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  playwright:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      API_URL: http://127.0.0.1:3100
      BASE_URL: http://127.0.0.1:3100
      TEST_CONTROL_KEY: testlab-control
      TEST_RUN_KEY: testlab-control
      TEST_RUN_ISOLATION: required
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/playwright/package-lock.json
      - name: Install application dependencies
        run: npm ci
      - name: Build application
        run: npm run build
      - name: Install Playwright dependencies
        run: npm ci
        working-directory: examples/playwright
      - name: Audit Playwright dependencies
        run: npm audit --audit-level=high
        working-directory: examples/playwright
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
        working-directory: examples/playwright
      - name: Typecheck Playwright suite
        run: npm run typecheck
        working-directory: examples/playwright
      - name: Run Playwright suite
        run: npm test
        working-directory: examples/playwright
      - name: Upload Playwright artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            examples/playwright/playwright-report
            examples/playwright/test-results
          if-no-files-found: warn
          retention-days: 7

  testng:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: examples/selenium-testng/pom.xml
      - name: Compile Selenium and TestNG suite
        run: mvn --batch-mode --no-transfer-progress -DskipTests test
        working-directory: examples/selenium-testng
      - name: Run offline TestNG framework tests
        run: mvn --batch-mode --no-transfer-progress -DsuiteXmlFile=src/test/resources/testng-unit.xml test
        working-directory: examples/selenium-testng

  container:
    needs:
      - verify
      - testng
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose configuration
        env:
          JWT_SECRET: ci-only-secret-that-is-longer-than-thirty-two-characters
        run: docker compose config --quiet
      - name: Build production container
        run: docker build --tag e2e-test-lab:ci .
